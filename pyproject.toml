[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "tabnote"
version = "0.1.0a0"
description = "A durable terminal editor for personal guitar and bass tabs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["textual==1.0.0"]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.9.10"]

[project.scripts]
tabnote = "tabnote.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

